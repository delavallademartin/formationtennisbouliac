<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Devenir jeune arbitre · Formation Bouliac Tennis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2e4; --ink: #11281b; --muted: #4c6354;
    --court: #1d5c3c; --court-ink: #f6f9ee; --line: rgba(246, 249, 238, 0.9);
    --ball: #dcf53c; --ball-ink: #11281b;
    --panel: #ffffff; --border: #c5d1b8; --track: #d3dcc6;
    --ok: #1d5c3c; --ok-ink: #f6f9ee;
    --retry: #ffffff; --retry-ink: #11281b;
    --focus: #e0561b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1a13; --ink: #eaf2de; --muted: #9db3a3;
      --court: #17503a; --court-ink: #f6f9ee;
      --ball: #d4ee38; --ball-ink: #11281b;
      --panel: #16271d; --border: #2d4636; --track: #2a4033;
      --ok: #dcf53c; --ok-ink: #11281b;
      --retry: #16271d; --retry-ink: #eaf2de;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1a13; --ink: #eaf2de; --muted: #9db3a3;
    --court: #17503a; --court-ink: #f6f9ee;
    --ball: #d4ee38; --ball-ink: #11281b;
    --panel: #16271d; --border: #2d4636; --track: #2a4033;
    --ok: #dcf53c; --ok-ink: #11281b;
    --retry: #16271d; --retry-ink: #eaf2de;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 600; font-size: 1.85rem; line-height: 1.1; margin: 6px 0 6px; }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: 1rem; }
  a.homelink, .link {
    font: inherit; font-weight: 700; color: var(--muted); background: none; border: 0;
    padding: 4px 0; cursor: pointer; text-decoration: none;
  }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .lbl { font-weight: 800; font-size: .85rem; color: var(--muted); }

  /* parcours */
  .path { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .step {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    font: inherit; color: inherit; cursor: pointer;
    background: var(--panel); border: 1.5px solid var(--border); border-radius: 16px; padding: 14px;
  }
  .step .num {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; font-family: "Fredoka", system-ui, sans-serif; font-weight: 600; font-size: 1.15rem;
    background: var(--court); color: var(--court-ink);
  }
  .step.final .num { background: var(--ball); color: var(--ball-ink); }
  .step .txt { flex: 1; }
  .step .txt b { display: block; font-size: 1.05rem; }
  .step .txt small { color: var(--muted); font-size: .88rem; }
  .step .st { flex: none; font-weight: 800; font-size: .85rem; color: var(--court); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .step .st { color: var(--ball); } }
  :root[data-theme="dark"] .step .st { color: var(--ball); }

  /* points de progression */
  .dots { display: flex; gap: 6px; margin: 4px 0 12px; }
  .dot { flex: 1; height: 6px; border-radius: 99px; background: var(--track); }
  .dot.done { background: var(--court); }
  .dot.on { background: var(--ball); outline: 1.5px solid var(--court); }

  /* leçon */
  .lesson { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 10px; }
  .lesson li { background: var(--panel); border: 1.5px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .lesson b { font-weight: 800; }
  .retenir { background: var(--ball); color: var(--ball-ink); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; font-weight: 700; }
  .retenir span { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; opacity: .75; margin-bottom: 2px; }

  /* boutons */
  .btn {
    font: inherit; font-weight: 800; font-size: 1rem; cursor: pointer;
    padding: 13px 10px; border-radius: 14px; border: 2px solid var(--court);
    background: var(--court); color: var(--court-ink);
  }
  .btn.big { width: 100%; padding: 16px; font-size: 1.1rem; }
  .btn.ok { background: var(--ok); color: var(--ok-ink); border-color: var(--ok); }
  .btn.retry, .btn.alt { background: var(--retry); color: var(--retry-ink); border-color: var(--border); }
  .btn:disabled { opacity: .4; cursor: default; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .stack { display: grid; gap: 10px; margin-top: 12px; }

  /* flash cards */
  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: .9rem; color: var(--muted); font-weight: 700; }
  .track { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .fill { height: 100%; width: 0; background: var(--court); transition: width .25s ease; }
  .scene { perspective: 1200px; }
  .card {
    position: relative; display: grid; width: 100%; min-height: 320px; cursor: pointer;
    transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.3,1);
    -webkit-tap-highlight-color: transparent;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1; position: relative; height: 100%; min-height: 320px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 18px; padding: 30px 26px;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
  }
  .front { background: var(--court); color: var(--court-ink); }
  .front::before { content: ""; position: absolute; inset: 11px; border: 2px solid var(--line); border-radius: 8px; pointer-events: none; }
  .back { background: var(--ball); color: var(--ball-ink); transform: rotateY(180deg); }
  .cat { align-self: flex-start; font-weight: 800; font-size: .82rem; padding: 3px 11px; border-radius: 99px; background: rgba(246,249,238,.16); }
  .back .cat { background: rgba(17,40,27,.12); }
  .q { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 500; font-size: 1.28rem; line-height: 1.3; margin: 0; }
  .a { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 700; font-size: 1.7rem; line-height: 1.2; margin: 0; }
  .n { margin: 0; font-size: 1rem; font-weight: 600; opacity: .85; }
  .hint { margin: 10px 0 0; text-align: center; font-size: .9rem; color: var(--muted); font-weight: 600; min-height: 1.3em; }
  .nav { display: flex; justify-content: center; margin-top: 10px; }

  /* résultat */
  .done { background: var(--court); color: var(--court-ink); border-radius: 18px; padding: 28px 24px; text-align: center; }
  .done h2 { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 600; font-size: 1.6rem; margin: 0 0 4px; }
  .done .score { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-size: 3rem; font-weight: 700; margin: 2px 0 8px; color: var(--ball); }
  .done p { margin: 0 0 6px; }
  .revoir { margin-top: 12px; text-align: left; }
  .revoir .btn { width: 100%; margin-top: 8px; background: transparent; color: var(--court-ink); border-color: var(--line); text-align: left; }
  .done .btn.main { width: 100%; background: var(--ball); color: var(--ball-ink); border-color: var(--ball); margin-top: 10px; }
  .done .btn.sec { width: 100%; background: transparent; color: var(--court-ink); border-color: var(--line); margin-top: 10px; }

  .art { margin-top: 4px; }
  .art svg { display: block; width: 100%; max-width: 170px; margin: 0 auto; border-radius: 6px; }
  .goal { font-size: .85rem; font-weight: 700; color: var(--muted); }
  :root { --good: #d9f2dd; --bad: #f8d7d3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --good: #1f4a33; --bad: #5a2622; } }
  :root[data-theme="dark"] { --good: #1f4a33; --bad: #5a2622; }
  .lesson li.hd { background: none; border: 0; padding: 8px 2px 0; font-weight: 800; font-size: .82rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .step.soon { opacity: .7; cursor: default; }
  .opts { display: grid; gap: 10px; margin: 14px 0 10px; }
  .opt { font: inherit; font-weight: 700; text-align: left; cursor: pointer; width: 100%; padding: 14px; border-radius: 14px;
         background: var(--panel); color: var(--ink); border: 2px solid var(--border); }
  .opt.good { background: var(--good); border-color: var(--court); }
  .opt.bad { background: var(--bad); border-color: #b3261e; }
  .opt:disabled { cursor: default; }
  .qbox { background: var(--panel); border: 1.5px solid var(--border); border-radius: 16px; padding: 16px; }
  .qbox .q { color: var(--ink); }
  .expl { margin: 0 0 10px; font-weight: 600; color: var(--muted); }
  .errs { text-align: left; margin-top: 12px; display: grid; gap: 8px; }
  .errs div { background: rgba(246,249,238,.12); border-radius: 12px; padding: 10px 12px; font-size: .92rem; }
  .errs b { font-weight: 800; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .card, .fill { transition: none; } }
  @media (max-width: 360px) { .q { font-size: 1.15rem; } .a { font-size: 1.5rem; } .face { padding: 26px 22px; } }
</style>
</head>

/* ---------------- Terrain entier avec joueurs et balle (vue de dessus) ---------------- */
const CS = 14, CMX = 1.3, CMY = 2.0, CW = 10.97, CL = 11.885, CSL = 6.4, CAL = 1.37, CR = 6;
function court(img, label) {
  const w = (CW + 2 * CMX) * CS, h = (2 * CL + 2 * CMY) * CS;
  const X = v => (CMX + v) * CS, Y = v => (CMY + v) * CS;
  const ln = (a, b, c, d) => '<line x1="' + X(a) + '" y1="' + Y(b) + '" x2="' + X(c) + '" y2="' + Y(d) + '"/>';
  const bx = img.x, by = img.far ? CL - img.d : CL + img.d;
  const hitTop = img.srv ? true : !img.far;
  const hl = img.srv ? "Serveur" : (img.hl || "Frappeur"), ol = img.srv ? "Relanceur" : (img.ol || "Adversaire");
  const topY = -0.8, botY = 2 * CL + 0.8;
  const hy = hitTop ? topY : botY, oy = hitTop ? botY : topY;
  const hx = img.srv ? CW / 2 + (img.srv === "droite" ? -1.4 : 1.4) : CW / 2;
  const ox = img.srv ? CW / 2 : (bx < CW / 2 ? CW / 2 + 1.0 : CW / 2 - 1.0);
  const px = v => Math.abs(v - CW / 2) < 0.5 ? CW / 2 + 2.5 : CW - v;
  const pl = (x, y, fill, stroke, r, text, dir) => {
    let s = '<circle cx="' + X(x) + '" cy="' + Y(y) + '" r="' + r + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5"/>';
    if (text) {
      const right = dir ? dir === "r" : X(x) <= w / 2 + 1;
      s += '<text x="' + (X(x) + (right ? 13 : -13)) + '" y="' + (Y(y) + 4) + '" font-size="11" fill="#ffffff" text-anchor="' + (right ? "start" : "end") + '">' + esc(text) + '</text>';
    }
    return s;
  };
  let s = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img"><title>' + esc(label) + '</title>';
  s += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="#3f8a55"/>';
  s += '<rect x="' + X(0) + '" y="' + Y(0) + '" width="' + (CW * CS) + '" height="' + (2 * CL * CS) + '" fill="#2f6db5"/>';
  s += '<g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="square">';
  s += ln(0, 0, CW, 0) + ln(0, 2 * CL, CW, 2 * CL) + ln(0, 0, 0, 2 * CL) + ln(CW, 0, CW, 2 * CL) + ln(CAL, 0, CAL, 2 * CL) + ln(CW - CAL, 0, CW - CAL, 2 * CL);
  s += ln(CAL, CL - CSL, CW - CAL, CL - CSL) + ln(CAL, CL + CSL, CW - CAL, CL + CSL) + ln(CW / 2, CL - CSL, CW / 2, CL + CSL);
  s += ln(CW / 2, 0, CW / 2, 0.45) + ln(CW / 2, 2 * CL, CW / 2, 2 * CL - 0.45) + '</g>';
  s += '<rect x="' + (X(0) - 6) + '" y="' + (Y(CL) - 2.5) + '" width="' + (CW * CS + 12) + '" height="5" fill="#f2f2f2" stroke="#444444" stroke-width="0.5"/>';
  s += '<line x1="' + X(hx) + '" y1="' + Y(hy) + '" x2="' + X(bx) + '" y2="' + Y(by) + '" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.85"/>';
  if (img.dbl) {
    s += pl(px(hx), hitTop ? CL - 1.8 : CL + 1.8, "#ff7a1a", "#ffffff", 6, "");
    s += pl(px(ox), hitTop ? CL + 1.8 : CL - 1.8, "#f2f2f2", "#444444", 6, "");
  }
  s += pl(hx, hy, "#ff7a1a", "#ffffff", 7, hl);
  s += pl(ox, oy, "#f2f2f2", "#444444", 7, ol, img.srv ? "" : (bx < CW / 2 ? "r" : "l"));
  s += '<circle cx="' + X(bx) + '" cy="' + Y(by) + '" r="' + CR + '" fill="#d9e83f" stroke="#6f7d0c" stroke-width="1"/></svg>';
  return s;
}

/* ---------------- Progression (gardée sur l'appareil) ---------------- */
const KEY = "formation-tcb-arbitre-v1";
let P = { done: {} };
function loadP() { try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d && d.done) P = d; } catch (e) {} }
function saveP() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
function pk(li, x) { return LEVELS[li].id + "-" + x; }

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmt(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
function shuffled(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let V = { view: "home" };

function dots(li, active) {
  const L = LEVELS[li];
  let h = '<div class="dots" aria-hidden="true">';
  for (let i = 0; i <= L.themes.length; i++) {
    const key = pk(li, i === L.themes.length ? "v" : "t" + i);
    const d = P.done[key];
    h += '<span class="dot' + (i === active ? " on" : (d && (i < L.themes.length || d.passed)) ? " done" : "") + '"></span>';
  }
  return h + '</div>';
}

  const li = V.li, L = LEVELS[li], n = V.cards.length, k = V.known, miss = V.missed;
  const msg = k === n ? "Parfait, aucune erreur !" : k / n >= 0.7 ? "Bien joué !" : "Continue, tu progresses !";
  let h = '<div class="topbar"><button class="link" data-act="level" data-l="' + li + '" type="button">← Niveau</button><span class="lbl">Thème ' + (V.ti + 1) + '</span></div>' +
    '<div class="done"><h2>' + msg + '</h2><div class="score">' + k + ' / ' + n + '</div>';
  if (miss.length) h += '<button class="btn main" data-act="redo" type="button">Refaire les ' + miss.length + ' cartes à revoir</button>';
  const cls = miss.length ? "sec" : "main";
  if (V.ti < L.themes.length - 1) {
    h += '<button class="btn ' + cls + '" data-act="theme" data-l="' + li + '" data-i="' + (V.ti + 1) + '" type="button">Thème suivant : ' + esc(L.themes[V.ti + 1].title) + '</button>';
  } else {
    h += '<button class="btn ' + cls + '" data-act="quiz" data-l="' + li + '" type="button">Passer au quiz de validation</button>';
  }
  return h + '<button class="btn sec" data-act="level" data-l="' + li + '" type="button">Retour au niveau</button></div>';
}

function quizHTML() {
  const L = LEVELS[V.li], q = V.qs[V.idx], total = V.qs.length;
  let h = '<div class="topbar"><button class="link" data-act="level" data-l="' + V.li + '" type="button">← Niveau</button>' +
    '<span class="lbl">Quiz de validation</span></div>' +
    '<div class="bar"><span>Question ' + (V.idx + 1) + ' sur ' + total + '</span><span>Objectif : ' + L.valid.pass + '/' + L.valid.n + '</span></div>' +
    '<div class="track" aria-hidden="true"><div class="fill" style="width:' + (V.idx / total * 100) + '%"></div></div>' +
    '<div class="qbox"><p class="q">' + esc(q.q) + '</p>' + (q.img ? '<div class="art">' + court(q.img, q.q) + '</div>' : "") + '</div><div class="opts">';
  q.opts.forEach((o, i) => {
    let cls = "opt";
    if (V.answered) cls += o.c ? " good" : (i === V.chosen ? " bad" : "");
    h += '<button class="' + cls + '" data-act="opt" data-i="' + i + '" type="button"' + (V.answered ? " disabled" : "") + '>' + esc(o.t) + '</button>';
  });
  h += '</div>';
  if (V.answered) {
    const good = q.opts[V.chosen].c;
    h += '<p class="expl">' + (good ? "Bonne réponse !" : "Pas tout à fait.") + (q.n ? " " + esc(q.n) : "") + '</p>' +
      '<button class="btn big" data-act="qnext" type="button">' + (V.idx + 1 < total ? "Question suivante" : "Voir mon résultat") + '</button>';
  }
  return h;
}

function qresultHTML() {
  const li = V.li, L = LEVELS[li], n = V.qs.length, k = V.score, passed = k >= L.valid.pass;
  let h = '<div class="topbar"><button class="link" data-act="level" data-l="' + li + '" type="button">← Niveau</button><span class="lbl">Quiz de validation</span></div>' +
    '<div class="done"><h2>' + (passed ? "Bravo, niveau validé !" : "Pas encore validé") + '</h2><div class="score">' + k + ' / ' + n + '</div>' +
    '<p>' + (passed ? "Tu as réussi le quiz de validation de " + esc(L.name) + "." : "Il faut " + L.valid.pass + " bonnes réponses sur " + L.valid.n + ". Tu peux recommencer avec de nouvelles questions.") + '</p>';
  if (V.wrong.length) {
    h += '<div class="errs">' + V.wrong.map(w => '<div><b>' + esc(w.q) + '</b><br>Ta réponse : ' + esc(w.mine) + '<br>Bonne réponse : ' + esc(w.good) + '</div>').join("") + '</div>';
  }
  h += '<button class="btn main" data-act="quiz" data-l="' + li + '" type="button">' + (passed ? "Refaire un quiz" : "Recommencer avec de nouvelles questions") + '</button>';
  if (!passed) h += '<button class="btn sec" data-act="level" data-l="' + li + '" type="button">Revoir les leçons</button>';
  else h += '<button class="btn sec" data-act="home" type="button">Retour aux niveaux</button>';
  return h + '</div>';
}

function render() {
  const v = V.view;
  document.getElementById("app").innerHTML =
    v === "home" ? homeHTML() : v === "level" ? levelHTML() : v === "lesson" ? lessonHTML() :
    v === "deck" ? deckHTML() : v === "result" ? resultHTML() : v === "quiz" ? quizHTML() : qresultHTML();
  window.scrollTo(0, 0);
}

/* ---------------- Actions ---------------- */
function startDeck(li, ti) {
  V = { view: "deck", li, ti, cards: LEVELS[li].themes[ti].cards.slice(), idx: 0, flipped: false, known: 0, missed: [], full: true };
  render();
}
function nextCard(ok) {
  if (ok) V.known++; else V.missed.push(V.cards[V.idx]);
  V.idx++; V.flipped = false;
  if (V.idx >= V.cards.length) {
    if (V.full) { P.done[pk(V.li, "t" + V.ti)] = { k: V.known, n: V.cards.length }; saveP(); }
    V.view = "result";
  }
  render();
}
function flip() {
  V.flipped = !V.flipped;
  const c = document.getElementById("card");
  c.classList.toggle("flipped", V.flipped);
  c.querySelector(".front").setAttribute("aria-hidden", String(V.flipped));
  c.querySelector(".back").setAttribute("aria-hidden", String(!V.flipped));
  document.getElementById("bRetry").disabled = !V.flipped;
  document.getElementById("bOk").disabled = !V.flipped;
  document.getElementById("hint").textContent = V.flipped ? "Tu le savais ?" : "Touche la carte pour voir la réponse";
}

function pickQuiz(L, n) {
  const bank = shuffled(L.bank), used = new Set(), pick = [];
  L.themes.forEach((t, ti) => bank.filter(x => x.t === ti).slice(0, 2).forEach(q => { pick.push(q); used.add(q); }));
  bank.forEach(q => { if (pick.length < n && !used.has(q)) { pick.push(q); used.add(q); } });
  return shuffled(pick.slice(0, n));
}
function startQuiz(li) {
  const L = LEVELS[li], n = Math.min(L.valid.n, L.bank.length);
  const qs = pickQuiz(L, n).map(q => Object.assign({}, q, {
    opts: shuffled([{ t: q.ok, c: true }].concat(q.ko.map(t => ({ t, c: false }))))
  }));
  V = { view: "quiz", li, qs, idx: 0, score: 0, chosen: null, answered: false, wrong: [] };
  render();
}
function pick(i) {
  if (V.answered) return;
  const q = V.qs[V.idx];
  V.chosen = i; V.answered = true;
  if (q.opts[i].c) V.score++;
  else V.wrong.push({ q: q.q, mine: q.opts[i].t, good: q.ok });
  render();
}
function qnext() {
  V.idx++; V.chosen = null; V.answered = false;
  if (V.idx >= V.qs.length) {
    const L = LEVELS[V.li], passed = V.score >= L.valid.pass, old = P.done[pk(V.li, "v")];
    P.done[pk(V.li, "v")] = { k: V.score, n: V.qs.length, passed: passed || !!(old && old.passed) };
    saveP();
    V.view = "qresult";
  }
  render();
}

document.addEventListener("click", e => {
  if (e.target.closest("#card")) { flip(); return; }
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  const a = t.dataset.act, l = +t.dataset.l;
  if (a === "home") { V = { view: "home" }; render(); }
  else if (a === "level") { V = { view: "level", li: l }; render(); }
  else if (a === "theme") { V = { view: "lesson", li: l, ti: +t.dataset.i }; render(); }
  else if (a === "cards") startDeck(V.li, V.ti);
  else if (a === "yes") nextCard(true);
  else if (a === "no" || a === "skip") nextCard(false);
  else if (a === "redo") { V = Object.assign({}, V, { view: "deck", cards: V.missed.slice(), idx: 0, flipped: false, known: 0, missed: [], full: false }); render(); }
  else if (a === "quiz") startQuiz(l);
  else if (a === "opt") pick(+t.dataset.i);
  else if (a === "qnext") qnext();
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && document.activeElement && document.activeElement.id === "card") { e.preventDefault(); flip(); }
});

loadP();
render();
</script>
</body>
</html>
